[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bmap"
version = "0.1.0"
description = "Buffer map construction and visualization helpers."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.24,<2.0",
  "anytree",
]

[project.optional-dependencies]
numba = ["numba"]
viz = ["pyvis", "networkx", "pydot"]
docs = ["sphinx>=7", "furo"]

[tool.hatch.build.targets.wheel]
include = ["bmap.py"]
